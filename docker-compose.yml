services:
  mysql:
    # 使用 MySQL 8.0 官方镜像
    image: mysql:8.0
    # 给容器起个名字，方便在 IDEA 的 Docker 面板里找到它
    container_name: springboot-mysql
    # 环境变量：设置 root 密码，并自动创建一个名为 springboot_db 的数据库
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: springboot_db
      # 解决 MySQL 8.0 和 Spring Boot 驱动之间的认证兼容性问题
    command: --default-authentication-plugin=mysql_native_password
    # 端口映射：宿主机的 3307 映射到容器的 3306
    ports:
      - "3307:3306"
    # 数据卷挂载（核心）：让数据永久保存在你电脑的 ./mysql_data 文件夹里，删了容器数据也不丢
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql            # 数据持久化
    # 确保容器意外挂掉后能自动重启
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.0
    container_name: springboot-redis
    ports:
      - "6379:6379"  # 注意，端口映射到宿主机的 6379
    # Redis 设置密码（如果不设置密码，Spring Boot 配置里的 password 要删掉或注释）
    command: redis-server --requirepass 123456
    restart: unless-stopped
    volumes:
      - redis_data:/data  # 记得在文件底部 volumes 里声明 redis_data
  rabbitmq:
    image: rabbitmq:3-management   # 带管理界面的镜像
    container_name: rabbitmq
    ports:
      - "5672:5672"    # 应用连接端口
      - "15672:15672"  # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # 数据持久化
  app:
    build: .                       # 使用当前目录的 Dockerfile 构建镜像
    container_name: course-selection-app
    ports:
      - "8080:8080"               # 应用端口映射
    depends_on:
      mysql:
        condition: service_healthy   # 等待 MySQL 健康检查通过
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/springboot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: 123456
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: