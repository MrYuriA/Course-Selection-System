version: '3.8'

services:
  mysql:
    # 使用 MySQL 8.0 官方镜像
    image: mysql:8.0
    # 给容器起个名字，方便在 IDEA 的 Docker 面板里找到它
    container_name: springboot-mysql
    # 环境变量：设置 root 密码，并自动创建一个名为 springboot_db 的数据库
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: springboot_db
      # 解决 MySQL 8.0 和 Spring Boot 驱动之间的认证兼容性问题
    command: --default-authentication-plugin=mysql_native_password
    # 端口映射：宿主机的 3307 映射到容器的 3306
    ports:
      - "3307:3306"
    # 数据卷挂载（核心）：让数据永久保存在你电脑的 ./mysql_data 文件夹里，删了容器数据也不丢
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    # 确保容器意外挂掉后能自动重启
    restart: unless-stopped