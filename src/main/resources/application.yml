spring:
  application:
    name: Course Selection System
  datasource:
    url: jdbc:mysql://localhost:3307/springboot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 2
          min-idle: 1
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    # 开启生产者 Confirm（消息到达交换机回调）
    publisher-confirm-type: correlated
    # 开启路由失败回调（消息未路由到队列时触发）
    publisher-returns: true
# 日志配置
logging:
  level:
    root: INFO
    org.example: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cache: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# MyBatis Plus 配置
mybatis-plus:
  type-enums-package: org.example.enums
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0